name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Project Truss plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node and Codex CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Codex CLI
        shell: bash
        run: npm install --global @openai/codex@0.144.0

      - name: Install validation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-validation.txt
          sudo apt-get update
          sudo apt-get install -y ripgrep jq rsync
          rg --version
          jq --version
          rsync --version

      - name: Run source validation suite
        shell: bash
        run: ./scripts/validate.sh
