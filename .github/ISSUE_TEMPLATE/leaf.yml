name: Application leaf
description: Publish one application-development leaf beneath a real root.
title: ""
labels: []
body:
  - type: input
    id: parent
    attributes:
      label: Parent
      description: Reference the governed root issue.
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: What to build
      description: Describe one end-to-end tracer-bullet behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable behavior checkboxes.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: blocked_by
    attributes:
      label: Blocked by
      description: Reference native blockers or state that none exist.
      value: "None — can start immediately."
    validations:
      required: true
