name: Governed outcome
description: Publish one Matt-shaped Project Truss root specification.
title: ""
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the problem from the user's perspective.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: Describe the observable solution from the user's perspective.
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: User Stories
      description: Use a numbered list in “As an actor, I want…, so that…” form.
      value: "1. As a "
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Implementation Decisions
      description: Record durable interfaces, architecture, and technical decisions.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing Decisions
      description: Record approved public test seams and verification policy.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: Name explicitly excluded behavior.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Further Notes
      description: Record constraints, authority, and optional Project projection.
    validations:
      required: true
